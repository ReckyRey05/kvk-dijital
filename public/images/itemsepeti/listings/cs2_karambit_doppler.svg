<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDoppler" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0714" />
      <stop offset="40%" stop-color="#190d29" />
      <stop offset="100%" stop-color="#08040d" />
    </linearGradient>
    <linearGradient id="dopplerBlade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d1266" />
      <stop offset="35%" stop-color="#93228d" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232630" />
      <stop offset="100%" stop-color="#12141a" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgDoppler)" rx="16" />

  <!-- Nebula Starfield Pattern -->
  <circle cx="120" cy="90" r="1.5" fill="#ec4899" opacity="0.6" />
  <circle cx="480" cy="80" r="2" fill="#a855f7" opacity="0.5" />
  <circle cx="520" cy="280" r="1.5" fill="#f472b6" opacity="0.7" />
  <circle cx="80" cy="310" r="1.5" fill="#ffffff" opacity="0.4" />
  <circle cx="280" cy="60" r="1" fill="#ec4899" opacity="0.4" />

  <!-- Glow effect -->
  <ellipse cx="280" cy="200" rx="160" ry="90" fill="#ec4899" opacity="0.25" filter="url(#purpleGlow)" />

  <!-- Top Badges -->
  <rect x="28" y="28" width="130" height="26" rx="6" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4" />
  <text x="93" y="45" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">★ COVERT KNIFE</text>

  <rect x="440" y="28" width="132" height="26" rx="6" fill="#ffffff" fill-opacity="0.08" />
  <text x="506" y="45" fill="#EDEEF2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">FACTORY NEW &bull; P2</text>

  <!-- Karambit Knife Graphic (Curved Talon) -->
  <g transform="translate(140, 70)">
    <!-- Finger Ring (Pommel) -->
    <circle cx="70" cy="200" r="32" fill="url(#handleGrad)" stroke="#ec4899" stroke-width="2" stroke-opacity="0.4" />
    <circle cx="70" cy="200" r="18" fill="#0b0714" stroke="#12141a" stroke-width="3" />

    <!-- Handle with finger grooves -->
    <path d="M 85 180 C 100 160, 130 145, 170 135 L 185 160 C 150 170, 125 185, 100 215 Z" fill="url(#handleGrad)" />
    <!-- Grip ridges -->
    <path d="M 115 155 L 125 175" stroke="#2e3440" stroke-width="3" stroke-linecap="round" />
    <path d="M 140 145 L 150 165" stroke="#2e3440" stroke-width="3" stroke-linecap="round" />
    <path d="M 165 138 L 175 155" stroke="#2e3440" stroke-width="3" stroke-linecap="round" />

    <!-- Blade Collar / Guard -->
    <polygon points="170,135 190,125 200,150 185,160" fill="#2c303d" />

    <!-- Curved Talon Blade (Doppler Phase 2 Galaxy) -->
    <path d="M 190 125 C 230 100, 310 95, 360 165 C 330 160, 260 175, 200 150 Z" fill="url(#dopplerBlade)" filter="url(#purpleGlow)" opacity="0.95" />
    <!-- Blade Edge Sharp Highlight -->
    <path d="M 190 125 C 230 100, 310 95, 360 165" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
    <!-- Spine contour -->
    <path d="M 200 150 C 260 175, 330 160, 360 165" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.6" />

    <!-- Galaxy Swirl effect inside blade -->
    <ellipse cx="275" cy="130" rx="35" ry="12" transform="rotate(-15 275 130)" fill="#f472b6" opacity="0.5" filter="url(#purpleGlow)" />
  </g>

  <!-- Typography watermark / metadata -->
  <g transform="translate(36, 345)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="-0.5">★ KARAMBIT | DOPPLER</text>
    <text x="0" y="18" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">PHASE 2 &bull; PINK GALAXY &bull; CLEAN CORNER</text>
  </g>
</svg>
