<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPubg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191307" />
      <stop offset="50%" stop-color="#2a1f0a" />
      <stop offset="100%" stop-color="#120c04" />
    </linearGradient>
    <linearGradient id="pubgYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a623" />
      <stop offset="100%" stop-color="#d07300" />
    </linearGradient>
    <filter id="pubgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgPubg)" rx="16" />

  <!-- Amber Glow -->
  <circle cx="300" cy="180" r="140" fill="#f5a623" opacity="0.2" filter="url(#pubgGlow)" />

  <!-- Top Badges -->
  <rect x="28" y="28" width="125" height="26" rx="6" fill="#f5a623" fill-opacity="0.15" stroke="#f5a623" stroke-width="1" stroke-opacity="0.4" />
  <text x="90" y="45" fill="#f5a623" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">PUBG MOBILE UC</text>

  <rect x="440" y="28" width="132" height="26" rx="6" fill="#ffffff" fill-opacity="0.08" />
  <text x="506" y="45" fill="#EDEEF2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ID İLE ANINDA YÜKLEME</text>

  <!-- PUBG Mobile UC Crate / Tokens Graphic -->
  <g transform="translate(170, 80)">
    <!-- Shadow -->
    <ellipse cx="130" cy="180" rx="90" ry="25" fill="#000000" opacity="0.6" filter="url(#pubgGlow)" />

    <!-- PUBG Supply Crate -->
    <rect x="50" y="60" width="160" height="110" rx="8" fill="#3a2f1c" stroke="#f5a623" stroke-width="2" />
    <rect x="65" y="70" width="130" height="90" rx="4" fill="#241c0e" />
    
    <!-- Crate Cross Straps -->
    <line x1="50" y1="115" x2="210" y2="115" stroke="#f5a623" stroke-width="3" />
    <line x1="130" y1="60" x2="130" y2="170" stroke="#f5a623" stroke-width="3" />

    <!-- Big UC Coin in front of crate -->
    <g transform="translate(70, 35)">
      <circle cx="60" cy="60" r="45" fill="#140f06" stroke="#f5a623" stroke-width="3" />
      <circle cx="60" cy="60" r="38" fill="url(#pubgYellow)" />
      <text x="60" y="73" fill="#140f06" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="-1">UC</text>
    </g>
  </g>

  <!-- Typography watermark / metadata -->
  <g transform="translate(36, 345)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="-0.5">660 + 60 UNKNOWN CASH (UC)</text>
    <text x="0" y="18" fill="#f5a623" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">OYUNCU ID NUMARASINA DOĞRUDAN AKTARIM</text>
  </g>
</svg>
