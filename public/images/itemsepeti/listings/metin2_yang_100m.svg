<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMetin2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140c03" />
      <stop offset="50%" stop-color="#261706" />
      <stop offset="100%" stop-color="#0f0701" />
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="30%" stop-color="#FBC02D" />
      <stop offset="70%" stop-color="#F57F17" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="ingotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF6F00" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgMetin2)" rx="16" />

  <!-- Oriental decorative diamond accents -->
  <g opacity="0.1" stroke="#FBC02D" stroke-width="1.5">
    <polygon points="50,50 65,65 50,80 35,65" fill="none" />
    <polygon points="550,50 565,65 550,80 535,65" fill="none" />
    <polygon points="50,330 65,345 50,360 35,345" fill="none" />
    <polygon points="550,330 565,345 550,360 535,345" fill="none" />
  </g>

  <!-- Golden radiance aura -->
  <circle cx="300" cy="190" r="130" fill="#FFB300" opacity="0.22" filter="url(#goldGlow)" />

  <!-- Top Badges -->
  <rect x="28" y="28" width="115" height="26" rx="6" fill="#FBC02D" fill-opacity="0.15" stroke="#FBC02D" stroke-width="1" stroke-opacity="0.4" />
  <text x="85" y="45" fill="#FFD54F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">METIN2 YANG</text>

  <rect x="440" y="28" width="132" height="26" rx="6" fill="#ffffff" fill-opacity="0.08" />
  <text x="506" y="45" fill="#EDEEF2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">MARMARA SUNUCUSU</text>

  <!-- Golden Ingot & Coins Graphic -->
  <g transform="translate(190, 95)">
    <!-- Back Coins Pile -->
    <ellipse cx="60" cy="140" rx="35" ry="16" fill="url(#goldCoin)" />
    <ellipse cx="60" cy="132" rx="35" ry="16" fill="url(#goldCoin)" stroke="#FFE082" stroke-width="1.5" />
    <ellipse cx="160" cy="145" rx="32" ry="15" fill="url(#goldCoin)" />
    <ellipse cx="160" cy="137" rx="32" ry="15" fill="url(#goldCoin)" stroke="#FFE082" stroke-width="1.5" />

    <!-- Center Gold Ingot (Won / Gold Bar) -->
    <!-- Shadow -->
    <ellipse cx="110" cy="160" rx="75" ry="25" fill="#0a0501" opacity="0.7" filter="url(#goldGlow)" />
    <!-- Bottom Face -->
    <polygon points="40,135 180,135 205,155 15,155" fill="#D84315" />
    <!-- Main Trapezoid Front -->
    <polygon points="30,85 190,85 180,135 40,135" fill="url(#ingotGrad)" stroke="#FFE082" stroke-width="1.5" />
    <!-- Top Chamfer -->
    <polygon points="55,55 165,55 190,85 30,85" fill="#FFF59D" />
    
    <!-- Chinese/Metin2 Ingot Dragon Stamping -->
    <circle cx="110" cy="70" r="14" fill="#FBC02D" stroke="#E65100" stroke-width="1" />
    <text x="110" y="75" fill="#B71C1C" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" text-anchor="middle">陽</text>

    <!-- Front Golden Coins Scatter -->
    <g transform="translate(10, 120)">
      <!-- Coin 1 -->
      <ellipse cx="25" cy="40" rx="26" ry="13" fill="#D84315" />
      <ellipse cx="25" cy="35" rx="26" ry="13" fill="url(#goldCoin)" stroke="#FFF9C4" stroke-width="1.5" />
      <rect x="21" y="32" width="8" height="6" rx="1" fill="#B71C1C" />

      <!-- Coin 2 -->
      <ellipse cx="75" cy="48" rx="28" ry="14" fill="#D84315" />
      <ellipse cx="75" cy="42" rx="28" ry="14" fill="url(#goldCoin)" stroke="#FFF9C4" stroke-width="1.5" />
      <rect x="71" y="39" width="8" height="6" rx="1" fill="#B71C1C" />

      <!-- Coin 3 -->
      <ellipse cx="140" cy="45" rx="26" ry="13" fill="#D84315" />
      <ellipse cx="140" cy="39" rx="26" ry="13" fill="url(#goldCoin)" stroke="#FFF9C4" stroke-width="1.5" />
      <rect x="136" y="36" width="8" height="6" rx="1" fill="#B71C1C" />

      <!-- Coin 4 (Tilted) -->
      <ellipse cx="185" cy="30" rx="18" ry="24" transform="rotate(35 185 30)" fill="url(#goldCoin)" stroke="#FFF9C4" stroke-width="1.5" />
    </g>
  </g>

  <!-- Typography watermark / metadata -->
  <g transform="translate(36, 345)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="-0.5">100.000.000 YANG (100M)</text>
    <text x="0" y="18" fill="#FFD54F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">1. KÖY MAVİ BAYRAK &bull; ANINDA TİCARET TESLİM</text>
  </g>
</svg>
