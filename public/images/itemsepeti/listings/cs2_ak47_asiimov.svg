<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1117" />
      <stop offset="50%" stop-color="#181b24" />
      <stop offset="100%" stop-color="#0c0d12" />
    </linearGradient>
    <linearGradient id="asiimovOrange" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c303d" />
      <stop offset="100%" stop-color="#1a1c24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)" rx="16" />
  
  <!-- Grid Lines Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="320" x2="600" y2="320" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
  </g>

  <!-- Glow effect behind rifle -->
  <ellipse cx="300" cy="200" rx="190" ry="65" fill="#FF7700" opacity="0.18" filter="url(#glow)" />

  <!-- Badge / Game Label -->
  <rect x="28" y="28" width="90" height="26" rx="6" fill="#D99532" fill-opacity="0.15" stroke="#D99532" stroke-width="1" stroke-opacity="0.3" />
  <text x="73" y="45" fill="#E8A33D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CS2 SKIN</text>
  
  <rect x="470" y="28" width="102" height="26" rx="6" fill="#ffffff" fill-opacity="0.08" />
  <text x="521" y="45" fill="#EDEEF2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">FLOAT 0.1824</text>

  <!-- AK-47 Silhouette Geometric / Asiimov Stylized -->
  <g transform="translate(60, 100)">
    <!-- Buttstock -->
    <path d="M 30 110 L 90 95 L 140 100 L 135 135 L 75 145 Z" fill="#F0F2F5" />
    <path d="M 45 105 L 85 97 L 90 120 L 50 125 Z" fill="url(#asiimovOrange)" />
    <path d="M 80 125 L 130 120 L 135 135 L 85 142 Z" fill="#1A1C23" />
    <line x1="30" y1="110" x2="35" y2="148" stroke="#1A1C23" stroke-width="6" stroke-linecap="round" />

    <!-- Receiver & Dust Cover -->
    <path d="M 140 100 L 260 90 L 265 130 L 135 135 Z" fill="#F0F2F5" />
    <path d="M 160 98 L 220 93 L 235 115 L 175 120 Z" fill="url(#asiimovOrange)" />
    <path d="M 190 112 L 255 107 L 258 128 L 193 133 Z" fill="#1A1C23" />
    <!-- Bolt Carrier / Ejection Port -->
    <rect x="200" y="98" width="35" height="12" rx="2" fill="#101216" />

    <!-- Pistol Grip -->
    <path d="M 150 135 L 170 185 L 145 190 L 130 140 Z" fill="#1A1C23" />
    <path d="M 140 145 L 160 185 L 152 188 L 133 148 Z" fill="url(#asiimovOrange)" />

    <!-- Curved Banana Magazine -->
    <path d="M 205 130 C 215 165, 235 195, 260 215 L 235 225 C 205 200, 185 165, 175 130 Z" fill="#F0F2F5" />
    <path d="M 210 145 C 220 170, 235 195, 252 210 L 242 215 C 225 200, 210 175, 202 150 Z" fill="url(#asiimovOrange)" />
    <path d="M 185 140 L 195 140 L 230 200 L 220 200 Z" fill="#1A1C23" />

    <!-- Handguard & Gas Tube -->
    <path d="M 260 90 L 370 85 L 375 120 L 265 125 Z" fill="#F0F2F5" />
    <path d="M 275 92 L 350 88 L 360 105 L 285 109 Z" fill="url(#asiimovOrange)" />
    <path d="M 290 110 L 365 106 L 368 120 L 293 124 Z" fill="#1A1C23" />
    <!-- Handguard Vents -->
    <circle cx="300" cy="98" r="3" fill="#101216" />
    <circle cx="320" cy="97" r="3" fill="#101216" />
    <circle cx="340" cy="96" r="3" fill="#101216" />

    <!-- Barrel & Gas Block -->
    <rect x="370" y="93" width="95" height="8" rx="2" fill="url(#metalGrad)" />
    <rect x="375" y="85" width="40" height="7" rx="1" fill="#1A1C23" />
    <!-- Front Sight Post -->
    <polygon points="430,95 435,78 440,78 445,95" fill="url(#asiimovOrange)" />
    <!-- Muzzle / Flash Hider -->
    <rect x="465" y="91" width="18" height="12" rx="2" fill="url(#asiimovOrange)" />
  </g>

  <!-- Typography watermark / metadata -->
  <g transform="translate(36, 345)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="-0.5">AK-47 | ASIIMOV</text>
    <text x="0" y="18" fill="#9498A6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">FIELD-TESTED &bull; CLASSIFIED RIFLE</text>
  </g>
</svg>
