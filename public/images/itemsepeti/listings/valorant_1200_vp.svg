<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgValorant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1923" />
      <stop offset="50%" stop-color="#1b2733" />
      <stop offset="100%" stop-color="#090f14" />
    </linearGradient>
    <linearGradient id="valRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4655" />
      <stop offset="100%" stop-color="#bd1826" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3847" />
      <stop offset="100%" stop-color="#141c24" />
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgValorant)" rx="16" />

  <!-- Tactical Grid / Valorant Lines -->
  <g opacity="0.1" stroke="#ff4655" stroke-width="1">
    <line x1="0" y1="50" x2="600" y2="50" />
    <line x1="0" y1="350" x2="600" y2="350" />
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <!-- Diagonal Corner Slash -->
    <line x1="0" y1="100" x2="100" y2="0" stroke-width="2" />
    <line x1="500" y1="400" x2="600" y2="300" stroke-width="2" />
  </g>

  <!-- Radiant Red Aura Glow -->
  <circle cx="300" cy="180" r="140" fill="#ff4655" opacity="0.2" filter="url(#redGlow)" />

  <!-- Top Badges -->
  <rect x="28" y="28" width="125" height="26" rx="6" fill="#ff4655" fill-opacity="0.15" stroke="#ff4655" stroke-width="1" stroke-opacity="0.4" />
  <text x="90" y="45" fill="#ff4655" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">VALORANT E-PIN</text>

  <rect x="440" y="28" width="132" height="26" rx="6" fill="#ffffff" fill-opacity="0.08" />
  <text x="506" y="45" fill="#EDEEF2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ANINDA OTOMATİK KOD</text>

  <!-- Valorant VP Digital Voucher Card -->
  <g transform="translate(160, 85)">
    <!-- Card Shadow -->
    <rect x="10" y="10" width="260" height="170" rx="14" fill="#000000" opacity="0.6" filter="url(#redGlow)" />
    <!-- Voucher Surface -->
    <rect x="0" y="0" width="260" height="170" rx="14" fill="url(#cardGrad)" stroke="#ff4655" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Top Card Strip -->
    <path d="M 0 14 Q 0 0 14 0 L 246 0 Q 260 0 260 14 L 260 38 L 0 38 Z" fill="#0f1923" />
    <circle cx="20" cy="19" r="4" fill="#ff4655" />
    <circle cx="34" cy="19" r="4" fill="#ff4655" opacity="0.5" />
    <text x="240" y="24" fill="#9498A6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="end">TR REGION</text>

    <!-- Valorant Iconic V Chevron Logo -->
    <g transform="translate(40, 55)">
      <polygon points="10,12 40,75 55,75 25,12" fill="url(#valRed)" />
      <polygon points="45,12 65,12 35,75 15,75" fill="#ece8e1" opacity="0.9" />
    </g>

    <!-- Big Points Text -->
    <text x="125" y="90" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-1">1200</text>
    <text x="125" y="112" fill="#ff4655" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="2">POINTS</text>

    <!-- Barcode simulation / Digital Code Strip -->
    <rect x="25" y="132" width="210" height="22" rx="4" fill="#0f1923" stroke="#2a3847" stroke-width="1" />
    <text x="130" y="147" fill="#34D399" font-family="'Courier New', monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="3">&bull;&bull;&bull;&bull;-&bull;&bull;&bull;&bull;-&bull;&bull;&bull;&bull;</text>
  </g>

  <!-- Typography watermark / metadata -->
  <g transform="translate(36, 345)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="-0.5">VALORANT 1200 VP</text>
    <text x="0" y="18" fill="#ff4655" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">RIOT GAMES TR &bull; DİJİTAL KASA ANINDA TESLİM</text>
  </g>
</svg>
